name: Test

on:
  pull_request:
  push:
    branches: [main]

# Every suite: the Nim core, the web build under node, and the desktop app
# compiled against GTK (no display; compiling is what that suite checks).
# pixi brings all of it from pixi.lock, the same as on a laptop.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
          cache: true

      - name: Nim core
        run: pixi run test nim

      - name: Web build
        run: pixi run test web

      - name: Desktop build
        run: pixi run test desktop
